<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Electrical Shop - Digital Price List & Catalogue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-28 antialiased selection:bg-blue-600 selection:text-white">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
            ⚡
          </div>
          <div>
            <h1 id="shopNameTitle" class="text-lg font-extrabold text-slate-900 leading-none">ElectroMart</h1>
            <p class="text-[11px] text-slate-500 font-medium mt-0.5">Live Price Catalogue & Estimate Builder</p>
          </div>
        </div>
        <a id="callBtnMobile" href="tel:+919876543210" class="sm:hidden text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-200">
          📞 Call Shop
        </a>
      </div>

      <!-- Search Bar -->
      <div class="relative w-full sm:w-96">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search fans, wires, MCB, watt, brand..." 
          class="w-full pl-9 pr-8 py-2 text-sm bg-slate-100 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"
        >
        <span class="absolute left-3 top-2.5 text-slate-400 text-sm pointer-events-none">🔍</span>
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-slate-600 text-sm px-1">✕</button>
      </div>
    </div>

    <!-- Category Filter Bar -->
    <div id="categoryBar" class="max-w-6xl mx-auto px-4 py-2.5 flex gap-2 overflow-x-auto no-scrollbar border-t border-slate-100">
      <!-- Category pills injected via JS -->
    </div>
  </header>

  <!-- Main Catalogue Section -->
  <main class="max-w-6xl mx-auto px-4 mt-4">
    <!-- Status & Count Bar -->
    <div class="flex items-center justify-between mb-3 text-xs text-slate-500">
      <span id="itemCountText">Showing 0 items</span>
      <span>Prices inclusive of GST</span>
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-5">
      <!-- Product cards injected via JS -->
    </div>
  </main>

  <!-- Floating Bottom Estimate Bar -->
  <div id="estimateBar" class="fixed bottom-0 inset-x-0 z-40 bg-slate-900 text-white p-3 shadow-2xl transform translate-y-full transition-transform duration-300">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div onclick="toggleDrawer(true)" class="cursor-pointer flex-1">
        <div class="flex items-center gap-2">
          <span id="cartBadgeCount" class="bg-blue-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">0 Items</span>
          <span class="text-xs text-slate-300 underline">View / Edit List ▲</span>
        </div>
        <div class="text-lg font-extrabold mt-0.5">
          Est. Total: ₹<span id="cartBarTotal">0</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleDrawer(true)" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl border border-slate-700">
          Review List
        </button>
        <button onclick="sendEstimateToWhatsApp()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-bold px-4 py-2.5 rounded-xl shadow flex items-center gap-1.5">
          <span>Send on WhatsApp</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Estimate / Quotation Modal Drawer -->
  <div id="estimateDrawer" class="fixed inset-0 z-50 hidden">
    <!-- Backdrop -->
    <div onclick="toggleDrawer(false)" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs"></div>

    <!-- Drawer Content -->
    <div class="fixed bottom-0 sm:bottom-auto sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 w-full sm:max-w-lg bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
      <!-- Drawer Header -->
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div>
          <h3 class="font-bold text-base text-slate-900">Estimate / Quotation List</h3>
          <p class="text-xs text-slate-500">Add items to calculate bill or enquire on WhatsApp</p>
        </div>
        <button onclick="toggleDrawer(false)" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 flex items-center justify-center text-slate-700 font-bold text-sm">✕</button>
      </div>

      <!-- Drawer Items List -->
      <div id="drawerItemsList" class="p-4 overflow-y-auto divide-y divide-slate-100 flex-1">
        <!-- Injected via JS -->
      </div>

      <!-- Drawer Footer -->
      <div class="p-4 border-t border-slate-200 bg-slate-50 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-slate-600">Estimated Total</span>
          <span class="text-xl font-extrabold text-slate-900">₹<span id="drawerTotalAmount">0</span></span>
        </div>
        <div class="flex gap-2">
          <button onclick="clearCart()" class="px-4 py-2.5 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-xs font-semibold">
            Clear All
          </button>
          <button onclick="sendEstimateToWhatsApp()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-2.5 rounded-xl shadow flex items-center justify-center gap-2">
            <span>📲 Send Quotation to Shop</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    // ==========================================
    // 1. SHOP CONFIGURATION
    // ==========================================
    const SHOP_CONFIG = {
      shopName: "Shreeji Electricals",
      whatsappNumber: "919876543210", // Format: 91 + 10-digit mobile number
      phoneNumber: "+919876543210",
      categories: [
        "All",
        "Switches & MCB",
        "Wires & Cables",
        "Lighting & LED",
        "Fans & Appliances",
        "Conduits & Fittings"
      ]
    };

    // ==========================================
    // 2. PRODUCT INVENTORY DATA (Database Ready)
    // Note: 'unit' and 'mrp' are completely optional!
    // ==========================================
    let products = [
      {
        id: "EL-101",
        name: "Polycab Flame Retardant (FR) House Wire",
        category: "Wires & Cables",
        specs: "1.5 sq mm | Multistrand Copper | Red/Yellow/Blue/Black",
        mrp: 2150,
        selling_price: 1780,
        unit: "90m Coil", // Unit provided -> shows "/ 90m Coil"
        in_stock: true,
        image_url: "https://images.unsplash.com/photo-1544724569-5f546fd6f2b5?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "EL-102",
        name: "Havells Euro-II Double Pole (DP) MCB",
        category: "Switches & MCB",
        specs: "32A | C-Curve | 240V AC | 10kA",
        mrp: 680,
        selling_price: 485,
        unit: "", // Empty unit -> shows just ₹485 cleanly
        in_stock: true,
        image_url: "https://images.unsplash.com/photo-1621905251189-08b45d6a269e?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "EL-103",
        name: "Crompton HighFlo Wave Plus Ceiling Fan",
        category: "Fans & Appliances",
        specs: "1200mm (48 inch) | 100% Copper Motor | Ivory/Brown",
        mrp: 2350,
        selling_price: 1690,
        // 'unit' omitted entirely -> handled cleanly without error
        in_stock: true,
        image_url: "https://images.unsplash.com/photo-1618941716939-553df3c6c278?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "EL-104",
        name: "Philips Astra Line LED Batten Tube Light",
        category: "Lighting & LED",
        specs: "20W | Cool Day Light (6500K) | 4 Feet",
        mrp: 400,
        selling_price: 240,
        unit: "",
        in_stock: true,
        image_url: "https://images.unsplash.com/photo-1565814329452-e1efa11c5b89?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "EL-105",
        name: "Anchor Roma Classic 1-Way Modular Switch",
        category: "Switches & MCB",
        specs: "10A | 1 Module | Glossy White",
        mrp: 42,
        selling_price: 26,
        unit: "Piece",
        in_stock: true,
        image_url: "https://images.unsplash.com/photo-1558002038-1055907df827?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "EL-106",
        name: "Precision Heavy Duty PVC Conduit Pipe",
        category: "Conduits & Fittings",
        specs: "25mm (1 inch) | Medium Mechanical Stress (MMS) | Black",
        mrp: 110,
        selling_price: 78,
        unit: "3m Pipe",
        in_stock: true,
        image_url: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "EL-107",
        name: "Philips AceBright LED Bulb",
        category: "Lighting & LED",
        specs: "9W | B22 Pin Base | Cool White",
        mrp: 145,
        selling_price: 85,
        unit: "",
        in_stock: true,
        image_url: "https://images.unsplash.com/photo-1550985616-10810253b84d?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: "EL-108",
        name: "Finolex 3-Core Submersible Flat Cable",
        category: "Wires & Cables",
        specs: "2.5 sq mm | Pure Copper | PVC Insulated",
        mrp: 140,
        selling_price: 105,
        unit: "Meter",
        in_stock: false, // Out of stock demo
        image_url: "https://images.unsplash.com/photo-1544724569-5f546fd6f2b5?auto=format&fit=crop&w=500&q=80"
      }
    ];

    // ==========================================
    // 3. STATE MANAGEMENT
    // ==========================================
    let activeCategory = "All";
    let estimateCart = {}; // Format: { "EL-101": quantity }

    // DOM Elements
    const shopNameTitle = document.getElementById("shopNameTitle");
    const callBtnMobile = document.getElementById("callBtnMobile");
    const categoryBar = document.getElementById("categoryBar");
    const productGrid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const itemCountText = document.getElementById("itemCountText");
    const estimateBar = document.getElementById("estimateBar");
    const cartBadgeCount = document.getElementById("cartBadgeCount");
    const cartBarTotal = document.getElementById("cartBarTotal");
    const estimateDrawer = document.getElementById("estimateDrawer");
    const drawerItemsList = document.getElementById("drawerItemsList");
    const drawerTotalAmount = document.getElementById("drawerTotalAmount");

    // Initialize Shop Branding
    shopNameTitle.textContent = SHOP_CONFIG.shopName;
    callBtnMobile.href = `tel:${SHOP_CONFIG.phoneNumber}`;
    document.title = `${SHOP_CONFIG.shopName} - Price List`;

    // Format Indian Currency (e.g., 1,780)
    function formatINR(num) {
      return Number(num).toLocaleString("en-IN");
    }

    // ==========================================
    // 4. RENDER CATEGORIES & PRODUCTS
    // ==========================================
    function renderCategories() {
      categoryBar.innerHTML = SHOP_CONFIG.categories.map(cat => `
        <button 
          onclick="setCategory('${cat}')"
          class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
            activeCategory === cat 
              ? 'bg-blue-600 text-white shadow-sm' 
              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          }">
          ${cat}
        </button>
      `).join("");
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderProducts();
    }

    function clearSearch() {
      searchInput.value = "";
      clearSearchBtn.classList.add("hidden");
      renderProducts();
    }

    function renderProducts() {
      const query = searchInput.value.toLowerCase().trim();
      clearSearchBtn.classList.toggle("hidden", query.length === 0);

      const filtered = products.filter(item => {
        const matchesCat = activeCategory === "All" || item.category === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(query) || 
                              (item.specs && item.specs.toLowerCase().includes(query)) ||
                              (item.id && item.id.toLowerCase().includes(query));
        return matchesCat && matchesSearch;
      });

      itemCountText.textContent = `Showing ${filtered.length} item${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        productGrid.innerHTML = `
          <div class="col-span-full bg-white rounded-2xl border border-slate-200 p-10 text-center my-4">
            <div class="text-3xl mb-2">🔌</div>
            <h3 class="font-bold text-slate-800 text-sm">No electrical items found</h3>
            <p class="text-xs text-slate-500 mt-1">Try searching a different watt, wire size, or brand.</p>
            <button onclick="setCategory('All'); clearSearch();" class="mt-4 text-xs font-semibold bg-blue-50 text-blue-600 px-4 py-2 rounded-lg">
              Reset Filters
            </button>
          </div>
        `;
        return;
      }

      productGrid.innerHTML = filtered.map(item => {
        // Optional MRP & Discount Check
        const hasDiscount = item.mrp && Number(item.mrp) > Number(item.selling_price);
        const discountPct = hasDiscount 
          ? Math.round(((item.mrp - item.selling_price) / item.mrp) * 100) 
          : 0;

        // Optional Unit Check (Only displays if unit has text)
        const hasUnit = item.unit && String(item.unit).trim() !== "";
        const unitBadge = hasUnit 
          ? `<span class="text-xs font-medium text-slate-500">/ ${item.unit.trim()}</span>` 
          : "";

        // Quantity in Estimate Cart
        const qtyInCart = estimateCart[item.id] || 0;

        // Direct single-item WhatsApp link
        const unitTextForWa = hasUnit ? ` (${item.unit.trim()})` : "";
        const singleWaMsg = encodeURIComponent(
          `Hello ${SHOP_CONFIG.shopName}, I want to enquire about:\n*${item.name}*\nSpecs: ${item.specs || 'Standard'}\nListed Price: ₹${formatINR(item.selling_price)}${unitTextForWa}`
        );

        return `
          <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs hover:shadow-md transition flex flex-col justify-between relative ${!item.in_stock ? 'opacity-70' : ''}">
            
            <!-- Top Product Info -->
            <div>
              <!-- Image Container -->
              <div class="relative h-36 sm:h-44 bg-slate-100 overflow-hidden">
                <img 
                  src="${item.image_url}" 
                  alt="${item.name}" 
                  loading="lazy"
                  onerror="this.src='https://placehold.co/400x300/e2e8f0/475569?text=Electrical+Item'"
                  class="w-full h-full object-cover"
                >
                ${hasDiscount ? `
                  <span class="absolute top-2 left-2 bg-emerald-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-md shadow-xs">
                    ${discountPct}% OFF
                  </span>
                ` : ''}
                ${!item.in_stock ? `
                  <div class="absolute inset-0 bg-slate-900/60 flex items-center justify-center">
                    <span class="bg-rose-600 text-white font-bold text-[11px] uppercase tracking-wider px-2.5 py-1 rounded">
                      Out of Stock
                    </span>
                  </div>
                ` : ''}
              </div>

              <!-- Title & Specs -->
              <div class="p-3">
                <div class="flex items-center justify-between gap-1">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600 truncate">${item.category}</span>
                  <span class="text-[10px] text-slate-400 font-mono">${item.id || ''}</span>
                </div>
                <h2 class="font-bold text-sm text-slate-900 leading-snug mt-1 line-clamp-2">${item.name}</h2>
                ${item.specs ? `
                  <p class="text-[11px] text-slate-600 bg-slate-100 rounded px-2 py-1 mt-2 font-medium line-clamp-2">
                    ${item.specs}
                  </p>
                ` : ''}
              </div>
            </div>

            <!-- Price Tag & Action Buttons -->
            <div class="p-3 pt-2 border-t border-slate-100 bg-slate-50/50">
              <!-- Price Tag Display -->
              <div class="flex items-baseline flex-wrap gap-1 mb-2.5">
                <span class="text-lg sm:text-xl font-extrabold text-slate-900">₹${formatINR(item.selling_price)}</span>
                ${unitBadge}
                ${hasDiscount ? `
                  <span class="text-[11px] text-slate-400 line-through ml-auto">MRP ₹${formatINR(item.mrp)}</span>
                ` : ''}
              </div>

              <!-- Action Area -->
              ${item.in_stock ? `
                <div class="flex items-center gap-1.5">
                  ${qtyInCart === 0 ? `
                    <button 
                      onclick="updateCart('${item.id}', 1)" 
                      class="flex-1 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white text-xs font-bold py-2 px-2 rounded-xl transition shadow-xs">
                      + Add to Estimate
                    </button>
                  ` : `
                    <div class="flex-1 flex items-center justify-between bg-blue-50 border border-blue-200 rounded-xl p-0.5">
                      <button onclick="updateCart('${item.id}', ${qtyInCart - 1})" class="w-7 h-7 rounded-lg bg-white text-blue-700 font-bold text-sm shadow-xs hover:bg-slate-100">-</button>
                      <span class="text-xs font-extrabold text-blue-900">${qtyInCart} added</span>
                      <button onclick="updateCart('${item.id}', ${qtyInCart + 1})" class="w-7 h-7 rounded-lg bg-blue-600 text-white font-bold text-sm shadow-xs hover:bg-blue-700">+</button>
                    </div>
                  `}
                  <a 
                    href="https://wa.me/${SHOP_CONFIG.whatsappNumber}?text=${singleWaMsg}" 
                    target="_blank"
                    title="Quick WhatsApp Enquiry"
                    class="w-9 h-9 flex items-center justify-center rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-sm font-bold shrink-0">
                    💬
                  </a>
                </div>
              ` : `
                <button disabled class="w-full py-2 rounded-xl bg-slate-200 text-slate-500 text-xs font-semibold cursor-not-allowed">
                  Currently Unavailable
                </button>
              `}
            </div>

          </div>
        `;
      }).join("");
    }

    // ==========================================
    // 5. ESTIMATE / QUOTATION CART FUNCTIONS
    // ==========================================
    function updateCart(productId, newQty) {
      if (newQty <= 0) {
        delete estimateCart[productId];
      } else {
        estimateCart[productId] = newQty;
      }
      renderProducts();
      updateEstimateUI();
    }

    function clearCart() {
      estimateCart = {};
      toggleDrawer(false);
      renderProducts();
      updateEstimateUI();
    }

    function updateEstimateUI() {
      const itemIds = Object.keys(estimateCart);
      let totalItems = 0;
      let totalAmount = 0;

      const drawerHTML = itemIds.map(id => {
        const product = products.find(p => p.id === id);
        if (!product) return "";

        const qty = estimateCart[id];
        const lineTotal = product.selling_price * qty;
        totalItems += qty;
        totalAmount += lineTotal;

        const hasUnit = product.unit && String(product.unit).trim() !== "";
        const unitLabel = hasUnit ? ` / ${product.unit.trim()}` : "";

        return `
          <div class="py-3 flex items-center justify-between gap-3">
            <div class="flex-1 min-w-0">
              <h4 class="text-xs font-bold text-slate-900 truncate">${product.name}</h4>
              <p class="text-[11px] text-slate-500">₹${formatINR(product.selling_price)}${unitLabel} × ${qty}</p>
            </div>
            <div class="flex items-center gap-2">
              <div class="flex items-center bg-slate-100 rounded-lg p-0.5 border border-slate-200">
                <button onclick="updateCart('${product.id}', ${qty - 1})" class="w-6 h-6 rounded bg-white text-slate-700 font-bold text-xs shadow-2xs">-</button>
                <span class="px-2.5 text-xs font-bold text-slate-900">${qty}</span>
                <button onclick="updateCart('${product.id}', ${qty + 1})" class="w-6 h-6 rounded bg-white text-slate-700 font-bold text-xs shadow-2xs">+</button>
              </div>
              <div class="w-16 text-right font-extrabold text-xs text-slate-900">
                ₹${formatINR(lineTotal)}
              </div>
            </div>
          </div>
        `;
      }).join("");

      cartBadgeCount.textContent = `${itemIds.length} Item${itemIds.length === 1 ? '' : 's'} (${totalItems} Qty)`;
      cartBarTotal.textContent = formatINR(totalAmount);
      drawerTotalAmount.textContent = formatINR(totalAmount);
      drawerItemsList.innerHTML = drawerHTML || `<p class="text-center text-slate-400 text-xs py-8">Your estimate list is empty.</p>`;

      // Show or hide bottom bar
      if (itemIds.length > 0) {
        estimateBar.classList.remove("translate-y-full");
      } else {
        estimateBar.classList.add("translate-y-full");
        toggleDrawer(false);
      }
    }

    function toggleDrawer(show) {
      if (show) {
        estimateDrawer.classList.remove("hidden");
      } else {
        estimateDrawer.classList.add("hidden");
      }
    }

    function sendEstimateToWhatsApp() {
      const itemIds = Object.keys(estimateCart);
      if (itemIds.length === 0) return;

      let totalAmount = 0;
      let lines = [`*⚡ Estimate Enquiry - ${SHOP_CONFIG.shopName}*`, `----------------------------`];

      itemIds.forEach((id, index) => {
        const product = products.find(p => p.id === id);
        if (!product) return;
        const qty = estimateCart[id];
        const sub = product.selling_price * qty;
        totalAmount += sub;

        const hasUnit = product.unit && String(product.unit).trim() !== "";
        const unitStr = hasUnit ? ` (${product.unit.trim()})` : "";

        lines.push(`${index + 1}. *${product.name}*${unitStr}`);
        lines.push(`   Qty: ${qty} × ₹${formatINR(product.selling_price)} = *₹${formatINR(sub)}*`);
      });

      lines.push(`----------------------------`);
      lines.push(`*Estimated Total: ₹${formatINR(totalAmount)}*`);
      lines.push(`\nPlease confirm stock availability and final bill price.`);

      const waUrl = `https://wa.me/${SHOP_CONFIG.whatsappNumber}?text=${encodeURIComponent(lines.join("\n"))}`;
      window.open(waUrl, "_blank");
    }

    // Event Listeners & Initial Boot
    searchInput.addEventListener("input", renderProducts);
    renderCategories();
    renderProducts();
  </script>
</body>
</html>
